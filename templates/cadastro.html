{% extends "layout.html" %}

    {% block conteudo %}

<link rel="stylesheet" href="../static/styles/login-cadastro.css">

<section class="pag_cad">
    <h1>Cadastro</h1>
    
    <form action="/cadastro" method="POST">
        <span><img src="../static/img/logo-kuma-preenchido.png" alt="Logo Kuma"></span>
        <div class="campos">
            <div class="campos__esquerda">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome aqui.">
        
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email aqui.">
        
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha aqui.">
            </div>
            <div class="campos__direita">
                <label for="tel">Telefone</label>
                <input type="text" id="tel" name="tel" placeholder="Digite seu telefone aqui.">
        
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco" placeholder="Digite seu endereço aqui.">
            </div>
        </div>
        <button type="submit">Cadastrar</button>
    </form>
    <a href="/login">Já tem uma conta? Faça login.</a>
</section>


{% endblock %}
