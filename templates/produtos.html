<link rel="stylesheet" href="../static/styles/produtos.css">


    
    <section class="product-banner">
        <h1 class="banner-title">PRODUTO</h1>
    </section>

    <main class="main-container">
    <div class="content-wrapper">
        
        <aside class="sidebar-filters">
            <h2 class="sidebar-title">Filtrar Opções</h2>
            <hr class="sidebar-divider">
            
            <div class="filter-section">
                <h3 class="section-title">Categorias</h3>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" class="custom-checkbox">
                        <span>Categoria 1</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" class="custom-checkbox">
                        <span>Categoria 2</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" class="custom-checkbox">
                        <span>Categoria 3</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" class="custom-checkbox">
                        <span>Categoria 4</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" class="custom-checkbox">
                        <span>Categoria 5</span>
                    </label>
                </div>
            </div>

            <div class="filter-section">
                <h3 class="section-title">Preços</h3>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" class="custom-checkbox">
                        <span>Até R$ 50,00</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" class="custom-checkbox">
                        <span>R$ 50,00 a R$ 100,00</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" class="custom-checkbox">
                        <span>R$ 100,00 a R$ 150,00</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" class="custom-checkbox">
                        <span>R$ 150,00 a R$ 200,00</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" class="custom-checkbox">
                        <span>Acima de R$ 200,00</span>
                    </label>
                </div>
            </div>
        </aside>

        <section class="products-area">
            <div class="results-count">
                Mostrando <span class="highlight">9</span> resultados
            </div>

            <div class="products-grid">
                {% for produto in produtos %}
                <a href="/produto/{{ produto.id_produto }}">
                    <div class="product-card">
                        <div class="product-image-placeholder">
                            <span>
                                <img src="{{ produto.imagem_produto }}" alt="{{ produto.nome_produto }}">
                            </span>
                        </div>
                        <div class="product-info">
                            <h4 class="product-name">{{ produto.nome_produto }}</h4>
                            <p class="product-price">{{ produto.preco_produto }}</p>
                        </div>
                    </div>
                </a>
                {% endfor %}
            </div>
        </section>
        
    </div>
</main>
